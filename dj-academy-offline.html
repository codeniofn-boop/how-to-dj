<style>
  /* Layout: a fixed curriculum rail (the roadmap) on the left, a working stage on the right.
     In a lesson the stage shows the instructor panel above the two-deck controller;
     the drills and the dashboard swap into the same stage. Single committed dark-studio look. */
  :root {
    /* Studio mode (default): blue-black with neon blue. Expert mode (masterclass): charcoal with neon pink + electric purple. */
    --bg-rgb: 10 12 17; --panel-rgb: 17 20 27; --panel2-rgb: 23 27 36; --panel3-rgb: 31 36 48;
    --line-rgb: 38 44 58; --line2-rgb: 50 58 75;
    --fg-rgb: 233 237 245; --muted-rgb: 141 150 170; --dim-rgb: 95 104 128;
    --neon-rgb: 56 200 255; --violet-rgb: 129 140 248;
    --pink-rgb: 255 45 149; --purple-rgb: 168 85 247;
    --bg: rgb(var(--bg-rgb));
    --panel: rgb(var(--panel-rgb));
    --panel-2: rgb(var(--panel2-rgb));
    --panel-3: rgb(var(--panel3-rgb));
    --line: rgb(var(--line-rgb));
    --line-2: rgb(var(--line2-rgb));
    --fg: rgb(var(--fg-rgb));
    --muted: rgb(var(--muted-rgb));
    --dim: rgb(var(--dim-rgb));
    --neon: rgb(var(--neon-rgb));
    --neon-soft: rgb(var(--neon-rgb) / .16);
    --neon-glow: rgb(var(--neon-rgb) / .5);
    --violet: rgb(var(--violet-rgb));
    --pink: rgb(var(--pink-rgb));
    --purple: rgb(var(--purple-rgb));
    --deck-b: #7cc7ff;
    --ok: #3ddc97;
    --warn: #ffb454;
    --bad: #ff5c7a;
    --low: #ff7a59;
    --mid: #5fe0a5;
    --high: #7cc7ff;
    --font-display: 'Unbounded', 'Manrope', system-ui, sans-serif;
    --font-body: 'Manrope', system-ui, -apple-system, 'Segoe UI', sans-serif;
    --font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    color-scheme: dark;
  }
  :root[data-mode="expert"] {
    --bg-rgb: 16 16 19; --panel-rgb: 23 23 28; --panel2-rgb: 30 30 36; --panel3-rgb: 41 40 49;
    --line-rgb: 54 52 64; --line2-rgb: 76 72 90;
    --fg-rgb: 245 241 248; --muted-rgb: 170 162 186; --dim-rgb: 116 108 134;
    --neon-rgb: 255 45 149; --violet-rgb: 168 85 247;
    --deck-b: rgb(168 85 247);
  }
  :root[data-mode="expert"] body {
    background: radial-gradient(1100px 520px at 8% -8%, rgb(168 85 247 / .22), transparent 60%),
                radial-gradient(900px 480px at 100% 0%, rgb(255 45 149 / .16), transparent 55%),
                var(--bg);
    background-attachment: fixed;
  }
  .mainstage-text { background: linear-gradient(90deg, var(--pink), var(--purple)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .mainstage-border { border: 1px solid transparent; background: linear-gradient(var(--panel), var(--panel)) padding-box, linear-gradient(120deg, var(--pink), var(--purple)) border-box; }
  .mainstage-glow { box-shadow: 0 0 36px rgb(var(--pink-rgb) / .22), 0 0 70px rgb(var(--purple-rgb) / .16); }
  .mainstage-band { background: linear-gradient(120deg, rgb(var(--pink-rgb) / .16), rgb(var(--purple-rgb) / .16) 60%, transparent); }
  .swap-btn { background: linear-gradient(120deg, var(--pink), var(--purple)); color: #fff; box-shadow: 0 0 24px rgb(var(--pink-rgb) / .45), 0 0 48px rgb(var(--purple-rgb) / .25); }
  .swap-btn:hover { filter: brightness(1.1); }
  .flash-pop { animation: flashPop .35s cubic-bezier(.2,1.4,.4,1) both; }
  @keyframes flashPop { from { opacity: 0; transform: scale(.7); } to { opacity: 1; transform: scale(1); } }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font-body);
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  body::before {
    content: ""; position: fixed; inset: 0 0 auto;
    height: env(safe-area-inset-top, 0px); background: var(--bg); z-index: 10;
  }
  h1, h2, h3 { text-wrap: balance; }
  .font-display { letter-spacing: -0.01em; }
  .tabular { font-variant-numeric: tabular-nums; }

  /* Guided-tour highlight: neon blue ring + pulse */
  .tour-target {
    position: relative; z-index: 1;
    box-shadow: 0 0 0 2px var(--neon), 0 0 22px 4px var(--neon-glow);
    animation: tourPulse 1.4s ease-in-out infinite;
    border-radius: 12px;
  }
  .tour-target.rounded-full { border-radius: 9999px; }
  @keyframes tourPulse {
    0%, 100% { box-shadow: 0 0 0 2px var(--neon), 0 0 14px 2px var(--neon-glow); }
    50% { box-shadow: 0 0 0 3px var(--neon), 0 0 30px 8px var(--neon-glow); }
  }

  .knob {
    touch-action: none; cursor: ns-resize; user-select: none;
    background: radial-gradient(circle at 35% 30%, #2b3242, #141822 72%);
    border-radius: 9999px;
  }
  .slider { touch-action: none; user-select: none; }
  .fader-track {
    background: linear-gradient(to right, transparent 46%, #05070a 46%, #05070a 54%, transparent 54%);
  }
  .fader-track-h {
    background: linear-gradient(to bottom, transparent 46%, #05070a 46%, #05070a 54%, transparent 54%);
  }
  .fader-cap {
    background: linear-gradient(180deg, #343b4a, #1b202b);
    border: 1px solid #434b5d;
    box-shadow: 0 3px 10px rgba(0,0,0,.6);
  }
  .led {
    width: 12px; height: 12px; border-radius: 9999px;
    background: #1b202b; border: 1px solid #2b3242;
    transition: background .05s linear, box-shadow .05s linear;
  }
  .led.on { background: var(--neon); box-shadow: 0 0 10px var(--neon); border-color: var(--neon); }
  .led.one { background: var(--warn); box-shadow: 0 0 10px var(--warn); border-color: var(--warn); }
  .wave-canvas { width: 100%; height: 100%; display: block; }
  .scroll-thin { scrollbar-width: thin; scrollbar-color: var(--line-2) transparent; }
  .scroll-thin::-webkit-scrollbar { width: 8px; height: 8px; }
  .scroll-thin::-webkit-scrollbar-thumb { background: var(--line-2); border-radius: 8px; }
  :focus-visible { outline: 2px solid var(--neon); outline-offset: 2px; }
  button { font-family: inherit; }
  .btn-press:active { transform: translateY(1px); }
  .shake { animation: shake .4s ease; }
  @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-5px)} 75%{transform:translateX(5px)} }
  .rise { animation: rise .35s ease both; }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .fade-out { animation: fadeOut 1.2s ease forwards; }
  @keyframes fadeOut { 0% { opacity: 1; transform: translateY(0) } 100% { opacity: 0; transform: translateY(-18px) } }
  @media (prefers-reduced-motion: reduce) {
    .tour-target, .shake, .rise, .fade-out, .flash-pop { animation: none !important; }
    * { transition-duration: .01ms !important; }
  }
</style>
