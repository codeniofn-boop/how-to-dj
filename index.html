<style>
  /* Layout: a fixed curriculum rail (the roadmap) on the left, a working stage on the right.
     In a lesson the stage shows the instructor panel above the two-deck controller;
     the drills and the dashboard swap into the same stage. Single committed dark-studio look. */
  :root {
    --bg: #0a0c11;
    --panel: #11141b;
    --panel-2: #171b24;
    --panel-3: #1f2430;
    --line: #262c3a;
    --line-2: #323a4b;
    --fg: #e9edf5;
    --muted: #8d96aa;
    --dim: #5f6880;
    --neon: #38c8ff;
    --neon-soft: rgba(56, 200, 255, .16);
    --neon-glow: rgba(56, 200, 255, .5);
    --ok: #3ddc97;
    --warn: #ffb454;
    --bad: #ff5c7a;
    --low: #ff7a59;
    --mid: #5fe0a5;
    --high: #7cc7ff;
    --font-display: 'Unbounded', 'Manrope', system-ui, sans-serif;
    --font-body: 'Manrope', system-ui, -apple-system, 'Segoe UI', sans-serif;
    --font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font-body);
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  body::before {
    content: ""; position: fixed; inset: 0 0 auto;

  }
  h1, h2, h3 { text-wrap: balance; }
  .font-display { letter-spacing: -0.01em; }
  .tabular { font-variant-numeric: tabular-nums; }

  /* Guided-tour highlight: neon blue ring + pulse */
  .tour-target {
    position: relative; z-index: 1;
    box-shadow: 0 0 0 2px var(--neon), 0 0 22px 4px var(--neon-glow);

  .tour-target.rounded-full { border-radius: 9999px; }

    0%, 100% { box-shadow: 0 0 0 2px var(--neon), 0 0 14px 2px var(--neon-glow); }
    50% { box-shadow: 0 0 0 3px var(--neon), 0 0 30px 8px var(--neon-glow); }

  .knob {

  }

  }
  .fader-cap {
    background: linear-gradient(180deg, #343b4a, #1b202b);
    border: 1px solid #434b5d;
    box-shadow: 0 3px 10px rgba(0,0,0,.6);
  }
  .led {
    width: 12px; height: 12px; border-radius: 9999px;

    transition: background .05s linear, box-shadow .05s linear;
  }
  .led.on { background: var(--neon); box-shadow: 0 0 10px var(--neon); border-color: var(--neon); }
  .led.one { background: var(--warn); box-shadow: 0 0 10px var(--warn); border-color: var(--warn); }
  .wave-canvas { width: 100%; height: 100%; display: block; }
  .scroll-thin { scrollbar-width: thin; scrollbar-color: var(--line-2) transparent; }
  .scroll-thin::-webkit-scrollbar { width: 8px; height: 8px; }
  .scroll-thin::-webkit-scrollbar-thumb { background: var(--line-2); border-radius: 8px; }
  :focus-visible { outline: 2px solid var(--neon); outline-offset: 2px; }
  button { font-family: inherit; }
  .btn-press:active { transform: translateY(1px); }
  .shake { animation: shake .4s ease; }
  @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-5px)} 75%{transform:translateX(5px)} }
  .rise { animation: rise .35s ease both; }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  @keyframes fadeOut { 0% { opacity: 1; transform: translateY(0) } 100% { opacity: 0; transform: translateY(-18px) } }
  @media (prefers-reduced-motion: reduce) {

<body>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script>window.react = window.React;</script>
<script src="https://unpkg.com/lucide-react@0.344.0/dist/umd/lucide-react.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.23.5/babel.min.js"></script>
<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef, useMemo, useCallback } = React;
const LucideLib = window.LucideReact || {};

/* ============================================================
   Utilities
   ============================================================ */
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const lerp = (a, b, t) => a + (b - a) * t;
const easeInOut = t => (t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t);
const nowMs = () => performance.now();
const wrapHalf = x => x - Math.round(x);                 // wraps a beat offset into [-0.5, 0.5]
const frac = x => x - Math.floor(x);
const pseudo = n => { const x = Math.sin(n * 12.9898 + 78.233) * 43758.5453; return x - Math.floor(x); };
const sleep = ms => new Promise(r => setTimeout(r, ms));
const cx = (...a) => a.filter(Boolean).join(' ');
const pick = arr => arr[Math.floor(Math.random() * arr.length)];

function Icon({ name, size = 18, className = '', ...rest }) {
  const C = LucideLib[name];
  if (!C) {
    return (
      <svg width={size} height={size} viewBox="0 0 24 24" className={className} fill="none" stroke="currentColor" strokeWidth="2" aria-hidden="true">
        <circle cx="12" cy="12" r="6" />
      </svg>
    );
  }
  return <C size={size} className={className} aria-hidden="true" {...rest} />;
}

/* ============================================================
   Music data: keys, tracks, patterns, track structure
   ============================================================ */
const NOTE_IDX = { C: 0, Db: 1, D: 2, Eb: 3, E: 4, F: 5, 'F#': 6, G: 7, Ab: 8, A: 9, Bb: 10, B: 11 };
// Camelot number -> [minor root (A side), major root (B side)]
const CAMELOT = { 1: ['Ab', 'B'], 2: ['Eb', 'F#'], 3: ['Bb', 'Db'], 4: ['F', 'Ab'], 5: ['C', 'Eb'], 6: ['G', 'Bb'],
  7: ['D', 'F'], 8: ['A', 'C'], 9: ['E', 'G'], 10: ['B', 'D'], 11: ['F#', 'A'], 12: ['Db', 'E'] };
const keyInfo = k => {
  const n = parseInt(k, 10), l = k.slice(-1);
  const root = CAMELOT[n][l === 'A' ? 0 : 1];
  return { n, l, root, name: `${root} ${l === 'A' ? 'minor' : 'major'}`, rootHz: 65.41 * Math.pow(2, NOTE_IDX[root] / 12) };
};
const compatibleKeys = (a, b) => {
  const A = keyInfo(a), B = keyInfo(b);
  if (A.l === B.l) { const d = Math.abs(A.n - B.n); return d === 0 || d === 1 || d === 11; }
  return A.n === B.n;
};
const keyRelation = (from, to) => {
  if (from === to) return 'Same key';
  const A = keyInfo(from), B = keyInfo(to);
  if (A.n === B.n) return A.l === 'A' ? 'Relative major (mood lift)' : 'Relative minor (moodier)';
  if (A.l === B.l) {
    const up = (B.n - A.n + 12) % 12;
    if (up === 1) return '+1: energy boost';
    if (up === 11) return '−1: energy drop';
    return `${Math.min(up, 12 - up)} steps away: clash`;
  }
  return 'Different letter and number: clash';
};

// Bass note offsets (semitones from root) at 16th-note steps, plus stab steps
const PATTERNS = {
  a: { bass: { 0: 0, 3: 0, 6: 0, 8: 0, 11: 3, 14: -2 }, stab: [2, 10] },
  b: { bass: { 0: 0, 2: 0, 4: 3, 7: 0, 8: 0, 10: 7, 12: 0, 14: 0 }, stab: [6, 14] },
  c: { bass: { 0: 0, 2: 0, 5: 0, 8: 0, 10: 5, 13: 0 }, stab: [4, 12] },
};

const TRACKS = {
  nightShift:   { id: 'nightShift',   title: 'Night Shift',      artist: 'Kora Vale',    bpm: 126, key: '8A',  pattern: 'a' },
  glassHarbour: { id: 'glassHarbour', title: 'Glass Harbour',    artist: 'Dmitri Lune',  bpm: 126, key: '9A',  pattern: 'b' },
  copperSky:    { id: 'copperSky',    title: 'Copper Sky',       artist: 'Oren Dale',    bpm: 122, key: '7A',  pattern: 'b' },
  lowTide:      { id: 'lowTide',      title: 'Low Tide Theory',  artist: 'Ferra',        bpm: 125, key: '8B',  pattern: 'c' },
  staticBloom:  { id: 'staticBloom',  title: 'Static Bloom',     artist: 'Yusra K.',     bpm: 127, key: '3B',  pattern: 'b' },
  saltwater:    { id: 'saltwater',    title: 'Saltwater Run',    artist: 'Mimi Ayo',     bpm: 126, key: '11A', pattern: 'c' },
  violetHours:  { id: 'violetHours',  title: 'Violet Hours',     artist: 'Tessaro',      bpm: 124, key: '2A',  pattern: 'a' },
};
const CRATE = ['glassHarbour', 'staticBloom', 'lowTide', 'saltwater', 'copperSky', 'violetHours'];

// A 64-bar loop of typical dance-track structure. Something changes every 8 bars.
const SECTIONS = [
  { until: 8,  name: 'Intro',     kick: 1, bass: 0,  mid: .35, high: .8 },
  { until: 16, name: 'Build',     kick: 1, bass: 0,  mid: .8,  high: 1 },
  { until: 32, name: 'Groove',    kick: 1, bass: 1,  mid: 1,   high: 1 },
  { until: 40, name: 'Breakdown', kick: 0, bass: 0,  mid: .7,  high: .4 },
  { until: 48, name: 'Build',     kick: 1, bass: .5, mid: .9,  high: 1 },
  { until: 64, name: 'Drop',      kick: 1, bass: 1,  mid: 1,   high: 1 },
];
const sectionOf = bar => { const b = ((bar % 64) + 64) % 64; return SECTIONS.find(s => b < s.until); };

// Visual energy of a 16th-note step, split into the three EQ bands
function stepAmps(patternId, step) {
  const s = ((step % 16) + 16) % 16, bar = Math.floor(step / 64), sec = sectionOf(bar), pat = PATTERNS[patternId];
  let low = 0, mid = 0.12, high = 0;
  if (s % 4 === 0) low += 1 * sec.kick;
  if (s % 4 === 1) low += 0.4 * sec.kick;
  if (pat.bass[s] !== undefined) low += 0.65 * sec.bass;
  if (s === 4 || s === 12) mid += 0.85;
  if (pat.stab.includes(s)) mid += 0.55;
  high += s % 2 === 0 ? (s % 4 === 2 ? 0.85 : 0.5) : 0.2;
  const j = 0.8 + 0.2 * pseudo(step * 3 + patternId.charCodeAt(0));
  return { low: Math.min(1, low) * j, mid: Math.min(1, mid * sec.mid) * j, high: Math.min(1, high * sec.high) * j };
}

/* ============================================================
   Deck transport + mixer maths
   ============================================================ */
const makeDeck = (id, track, over = {}) => ({
  id, track, playing: false, startedAt: 0, offsetBeats: 0, cueBeats: 0, pitch: 0,
  eq: { low: 0, mid: 0, high: 0 }, fader: 1, autoSync: false, ...over,
});
const effBpm = d => ((d.track && d.track.bpm) || 120) * (1 + d.pitch / 100);
const beatsOf = (d, t) => (d.playing ? d.offsetBeats + ((t - d.startedAt) / 60000) * effBpm(d) : d.offsetBeats);
const rebase = (d, t) => ({ ...d, offsetBeats: beatsOf(d, t), startedAt: t });
const bandGain = v => (v >= 0 ? 1 + v : Math.pow(Math.max(0, 1 + v), 2));
const faderGain = f => f * f;
const xfGains = x => ({ A: Math.cos((x * Math.PI) / 2), B: Math.sin((x * Math.PI) / 2) });
const eqLabel = v => (v <= -0.98 ? 'KILL' : `${v > 0 ? '+' : ''}${(v > 0 ? 6 * v : 24 * v).toFixed(1)} dB`);
const pctLabel = v => `${v >= 0 ? '+' : ''}${v.toFixed(1)}%`;
const pitchFor = (targetBpm, baseBpm) => (targetBpm / baseBpm - 1) * 100;

function bassLevels(sim) {
  const xg = xfGains(sim.xf);
  const lv = id => {
    const d = sim.decks[id];
    if (!d.track || !d.playing) return 0;
    const sec = sectionOf(Math.floor(beatsOf(d, nowMs()) / 4));
    return bandGain(d.eq.low) * faderGain(d.fader) * xg[id] * (sec.kick * 0.6 + sec.bass * 0.4);
  };
  return { A: Math.min(1, lv('A')), B: Math.min(1, lv('B')) };
}
function tempoStatus(sim, t) {
  const A = sim.decks.A, B = sim.decks.B;
  if (!A.track || !B.track) return { dBpm: 0, phase: 0, tempoOk: false, locked: false, both: false };
  const dBpm = effBpm(B) - effBpm(A);
  const both = A.playing && B.playing;
  const phase = both ? wrapHalf(beatsOf(B, t) - beatsOf(A, t)) : 0;
  const tempoOk = Math.abs(dBpm) < 0.1;
  return { dBpm, phase, tempoOk, both, locked: both && tempoOk && Math.abs(phase) < 0.06 };
}

/* ============================================================
   Curriculum
   ============================================================ */
const LESSONS = [
  {
    id: 1, slug: 'phrasing', title: 'Counting Beats & Phrasing', subtitle: 'Understanding 4-bar and 8-bar structures', icon: 'Hash',
    intro: 'Dance music is built on a grid. Learn to feel it and every mix you do will land in the right place.',
    concepts: [
      { icon: 'Activity', term: 'Beat', text: 'The steady pulse. The kick drum usually hits on every beat. Count it out loud: 1, 2, 3, 4.' },
      { icon: 'Hash', term: 'Bar', text: 'Four beats. After beat 4 you start again at 1, and that is a new bar.' },
      { icon: 'Layers', term: 'Phrase', text: 'Eight bars, which is 32 beats. Producers change something at the start of every phrase: a sound comes in, the bass drops out, a vocal starts. Many tracks also use 4-bar (16-beat) mini-phrases inside that.' },
      { icon: 'Target', term: 'Why it matters', text: 'Start the next track on beat 1 of a phrase and the changes in both tracks line up. The mix sounds planned instead of random.' },
    ],
    setup: () => ({
      decks: { A: makeDeck('A', TRACKS.nightShift), B: makeDeck('B', TRACKS.glassHarbour, { fader: 1 }) },
      xf: 0,
    }),
    steps: [
      { targets: ['A.play'], title: 'Press play', text: 'Press PLAY on Deck A. The kick drum hits on every beat. That pulse is what you will count.',
        tip: 'Count out loud with the beat lights: 1, 2, 3, 4.', goal: c => c.sim.decks.A.playing, run: api => api.play('A') },
      { targets: ['A.counter'], title: 'Count the bars', text: 'Four beats make one BAR. Watch the counter: when beat 4 passes, the bar number ticks up and the count starts again at 1. Keep counting for four bars (16 beats).',
        tip: 'Count bars the way DJs do: "1-2-3-4, 2-2-3-4, 3-2-3-4, 4-2-3-4".', goal: c => c.beatsA - c.startBeats >= 16, waiting: 'Counting with you…' },
      { targets: ['A.phrase'], title: 'Feel the phrase', text: 'Eight bars make a PHRASE (32 beats). The phrase strip fills as the bars pass. Watch what happens when a new phrase begins: the track changes section, because producers arrange music in 8-bar blocks.',
        tip: 'The section label above the waveform (Intro, Build, Groove…) changes only on phrase boundaries.', goal: c => Math.floor(c.beatsA / 32) > Math.floor(c.startBeats / 32), waiting: 'Waiting for the next phrase…' },
      { targets: ['B.play'], title: 'Drop on the one', text: 'Now press PLAY on Deck B exactly when Deck A starts a new bar (beat 1). DJs call this "dropping on the one".',
        tip: 'Watch Deck A\'s beat lights. Press right as the orange light flashes.', goal: c => c.sim.decks.B.playing,
        onMet: c => { const off = wrapHalf(c.beatsA / 4) * 4; const ms = Math.round(Math.abs(off) / effBpm(c.sim.decks.A) * 60000); return ms <= 120 ? `Dropped ${ms} ms ${off >= 0 ? 'late' : 'early'}. That is on the one.` : `Dropped ${ms} ms ${off >= 0 ? 'late' : 'early'}. Close enough to learn from; the Phrase Drop drill will sharpen this.`; },
        run: async api => { await api.waitForBeatOne('A'); api.play('B'); } },
      { targets: ['xf'], title: 'Hear both tracks', text: 'Slide the CROSSFADER to the middle so both tracks play together. Both counters now run in step because the tracks share one tempo.',
        tip: 'Sounds a little muddy with both basslines? Lesson 3 fixes exactly that.', goal: c => Math.abs(c.sim.xf - 0.5) < 0.12, run: api => api.tween('xf', 0.5, 1500) },
    ],
    quiz: [
      { q: 'How many beats are in one bar of house or techno?', options: ['2', '4', '8', '16'], answer: 1, why: 'Count 1-2-3-4 and you have counted a bar.' },
      { q: 'A standard phrase is how long?', options: ['4 beats', '8 beats', '8 bars (32 beats)', '64 bars'], answer: 2, why: 'Eight bars of four beats each. Producers change something at the start of each one.' },
      { q: 'The safest moment to start the next track is…', options: ['Whenever the crowd cheers', 'On beat 1 of a new phrase', 'On beat 3 of any bar', 'During the vocal'], answer: 1, why: 'Dropping on beat 1 of a phrase lines up both tracks\' changes.' },
    ],
  },
  {
    id: 2, slug: 'beatmatch', title: 'The Art of the Beatmatch', subtitle: 'Aligning different track speeds by hand', icon: 'Gauge',
    intro: 'Two tracks, two speeds. Beatmatching makes them one tempo so the kicks land together.',
    concepts: [
      { icon: 'Gauge', term: 'BPM', text: 'Beats per minute, the tempo. 126 BPM means 126 kicks every minute.' },
      { icon: 'SlidersHorizontal', term: 'Pitch slider', text: 'Speeds the track up or down by a percentage, usually within ±8%. Pushing a 122 BPM track to +3.3% gives 126 BPM.' },
      { icon: 'Activity', term: 'Phase', text: 'Same speed is not the same timing. If the kicks do not land together, nudge the incoming track forward or back until they do.' },
      { icon: 'Headphones', term: 'Headphone cue', text: 'You hear the incoming track in your headphones only, match it there, then bring it in on the channel fader.' },
    ],
    setup: () => ({
      decks: { A: makeDeck('A', TRACKS.nightShift, { offsetBeats: 64, cueBeats: 64 }), B: makeDeck('B', TRACKS.copperSky, { offsetBeats: 64, cueBeats: 64, fader: 0 }) },
      xf: 0.5,
    }),
    steps: [
      { targets: ['A.play'], title: 'Start the live track', text: 'Press PLAY on Deck A. This is what the crowd hears: 126.0 BPM.', goal: c => c.sim.decks.A.playing, run: api => api.play('A') },
      { targets: ['B.bpm'], title: 'Read both tempos', text: 'Look at Deck B: 122.0 BPM, slower than Deck A. To mix them, Deck B must run at 126.0. That means speeding it up by about +3.3%.',
        tip: 'The maths: (126 ÷ 122 − 1) × 100 = +3.3%.', goal: null },
      { targets: ['B.play'], title: 'Start Deck B', text: 'Press PLAY on Deck B. Watch the two rows of beat lights: they drift apart because the tempos differ.', goal: c => c.sim.decks.B.playing, run: api => api.play('B') },
      { targets: ['B.pitch'], title: 'Match the tempo', text: 'Push Deck B\'s PITCH slider up until its readout shows 126.0 BPM. Small moves: the last 0.1 BPM matters.',
        tip: 'The TEMPO meter in the mixer shows the difference. Aim for 0.0.', goal: c => Math.abs(effBpm(c.sim.decks.B) - effBpm(c.sim.decks.A)) < 0.1,
        run: api => api.tween('B.pitch', pitchFor(126, 122), 2500) },
      { targets: ['B.nudge', 'phase'], title: 'Line up the beats', text: 'Same speed is not the same timing. Tap NUDGE ◀ or ▶ on Deck B to slide its beats until both rows of lights flash together and the meter reads LOCKED.',
        tip: 'If Deck B flashes after Deck A (late), tap ▶ to push it forward. If it flashes first, tap ◀.', goal: c => tempoStatus(c.sim, c.now).locked,
        run: api => api.alignPhase('B') },
      { targets: ['B.fader'], title: 'Blend it in', text: 'Locked. Bring Deck B\'s channel fader up slowly over the next 16 beats. The crowd now hears both tracks in time.',
        goal: c => c.sim.decks.B.fader >= 0.95, run: api => api.tween('B.fader', 1, 7500) },
    ],
    quiz: [
      { q: 'Deck A plays at 126 BPM. Deck B\'s track is 122 BPM. What do you do?', options: ['Slow Deck A down by 8%', 'Push Deck B\'s pitch up by about +3.3%', 'Press play harder', 'Turn Deck B\'s LOW knob up'], answer: 1, why: '(126 ÷ 122 − 1) × 100 ≈ +3.3%. You match the incoming track to the live one.' },
      { q: 'Both decks read 126.0 BPM but the beat lights flash out of step. What is wrong?', options: ['The tempo is still different', 'The phase is off: nudge the incoming track', 'The EQ is wrong', 'The crossfader is centred'], answer: 1, why: 'Same speed is not the same timing. Nudge until the beats land together.' },
      { q: 'While beatmatching, where do you listen to the incoming track?', options: ['Through the main speakers', 'In your headphones (the cue)', 'You do not need to listen', 'On your phone'], answer: 1, why: 'The cue lets you match privately before the crowd hears the new track.' },
    ],
  },
  {
    id: 3, slug: 'bass-swap', title: 'The Perfect Bass Swap', subtitle: 'EQ management for clean transitions', icon: 'SlidersHorizontal',

/* ============================================================
   Progress (local React state, mirrored to localStorage when available)
   ============================================================ */
const STORAGE_KEY = 'dj-academy-progress-v1';
const freshProgress = () => ({
  lessons: { 1: { tour: false, done: false }, 2: { tour: false, done: false }, 3: { tour: false, done: false }, 4: { tour: false, done: false } },
  xp: 0, badges: [], phrase: { rounds: [], best: 0 }, ear: { rounds: [], bestAvg: null },
});
function loadProgress() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) { const p = JSON.parse(raw); const f = freshProgress(); return { ...f, ...p, lessons: { ...f.lessons, ...(p.lessons || {}) }, phrase: { ...f.phrase, ...(p.phrase || {}) }, ear: { ...f.ear, ...(p.ear || {}) } }; }
  } catch (e) { /* storage unavailable: keep in-memory state only */ }

}
function saveProgress(p) { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(p)); } catch (e) { /* ignore */ } }
function applyProgress(p, action) {
  if (action.type === 'reset') return { next: freshProgress(), earned: [], xp: 0 };
  const next = { ...p, lessons: { ...p.lessons } };
  let xp = 0;
  if (action.type === 'tour') { const l = p.lessons[action.id]; if (!l.tour) { next.lessons[action.id] = { ...l, tour: true }; xp += 50; } }
  if (action.type === 'quiz') { const l = p.lessons[action.id]; if (!l.done) { next.lessons[action.id] = { ...l, tour: true, done: true }; xp += 100; } }
  if (action.type === 'phrase') { const r = action.round; next.phrase = { rounds: [r, ...p.phrase.rounds].slice(0, 20), best: Math.max(p.phrase.best, r.pct) }; xp += Math.round(r.pct / 2); }
  if (action.type === 'ear') {
    const r = action.round;
    const bestAvg = r.success && (p.ear.bestAvg == null || r.avg < p.ear.bestAvg) ? r.avg : p.ear.bestAvg;
    next.ear = { rounds: [r, ...p.ear.rounds].slice(0, 20), bestAvg }; xp += r.success ? 60 : 20;
  }
  next.xp = p.xp + xp;
  const earned = BADGES.filter(b => !next.badges.includes(b.id) && b.test(next));
  next.badges = [...next.badges, ...earned.map(b => b.id)];
  return { next, earned, xp };
}

  const onKeyDown = e => {
    const step = range / 40;
    if (e.key === 'ArrowUp' || e.key === 'ArrowRight') { e.preventDefault(); onChange(clamp(value + step, min, max)); }
    else if (e.key === 'ArrowDown' || e.key === 'ArrowLeft') { e.preventDefault(); onChange(clamp(value - step, min, max)); }
    else if (e.key === 'Home') onChange(min); else if (e.key === 'End') onChange(max); else if (e.key === '0') onChange(clamp(0, min, max));
  };
  return (
    <div className="flex flex-col items-center gap-1 select-none">
      <div ref={ref} role="slider" tabIndex={disabled ? -1 : 0} aria-label={label} aria-valuemin={min} aria-valuemax={max}
        aria-valuenow={+value.toFixed(2)} aria-valuetext={format(value)}
        className={cx('knob rounded-full', highlight && 'tour-target', disabled && 'opacity-50')} style={{ width: size, height: size }}
        onPointerDown={onPointerDown} onPointerMove={onPointerMove} onPointerUp={onPointerUp} onPointerCancel={onPointerUp}
        onDoubleClick={() => !disabled && onChange(clamp(0, min, max))} onKeyDown={onKeyDown}>
        <svg width={size} height={size} aria-hidden="true">
          <path d={arc(startA, startA + sweep, r)} stroke="var(--line-2)" strokeWidth="3" fill="none" strokeLinecap="round" />
          <path d={arc(zeroAngle, angle, r)} stroke={color} strokeWidth="3" fill="none" strokeLinecap="round" />
          <circle cx={c} cy={c} r={r - 9} fill="none" stroke="#2b3242" />
          <line x1={ix0} y1={iy0} x2={ix1} y2={iy1} stroke="#ffffff" strokeWidth="2.5" strokeLinecap="round" />
        </svg>
      </div>
      <div className="text-[10px] font-semibold uppercase tracking-[0.18em]" style={{ color }}>{label}</div>
      <div className="font-mono text-[11px] text-fg/80 tabular">{format(value)}</div>
    </div>
  );
}

/* Linear fader (vertical or horizontal) */
function Slider({ value, onChange, min = 0, max = 1, orientation = 'vertical', length = 150, thickness = 40, label, format, center = false, highlight, disabled, ticks = 5, capColor }) {
  const ref = useRef(null), drag = useRef(false);
  const pad = 12, norm = (value - min) / (max - min), vertical = orientation === 'vertical';
  const posFromEvent = e => {
    const r = ref.current.getBoundingClientRect();
    const n = vertical ? 1 - (e.clientY - r.top - pad) / (r.height - 2 * pad) : (e.clientX - r.left - pad) / (r.width - 2 * pad);
    return clamp(n, 0, 1);
  };
  const set = n => onChange(min + n * (max - min));
  const onPointerDown = e => { if (disabled) return; e.preventDefault(); ref.current.setPointerCapture(e.pointerId); drag.current = true; set(posFromEvent(e)); };
  const onPointerMove = e => { if (drag.current) set(posFromEvent(e)); };
  const onPointerUp = () => { drag.current = false; };
  const onKeyDown = e => {
    const step = (max - min) / (e.shiftKey ? 10 : 50);
    if (e.key === 'ArrowUp' || e.key === 'ArrowRight') { e.preventDefault(); onChange(clamp(value + step, min, max)); }
    else if (e.key === 'ArrowDown' || e.key === 'ArrowLeft') { e.preventDefault(); onChange(clamp(value - step, min, max)); }
    else if (e.key === 'Home') onChange(min); else if (e.key === 'End') onChange(max);
  };
  const travel = length - 2 * pad;
  const capPos = pad + (vertical ? (1 - norm) * travel : norm * travel);
  const tickEls = Array.from({ length: ticks }, (_, i) => { const p = pad + (i / (ticks - 1)) * travel; return vertical
    ? <span key={i} className="absolute left-1 right-1 h-px bg-line2" style={{ top: p }} />
    : <span key={i} className="absolute top-1 bottom-1 w-px bg-line2" style={{ left: p }} />; });
  const centerPos = center ? pad + (vertical ? (1 - (0 - min) / (max - min)) * travel : ((0 - min) / (max - min)) * travel) : null;
  return (
    <div className={cx('flex items-center gap-1 select-none', vertical ? 'flex-col' : 'flex-row')}>
      {label && vertical && <div className="text-[10px] font-semibold uppercase tracking-[0.18em] text-muted">{label}</div>}
      <div ref={ref} role="slider" tabIndex={disabled ? -1 : 0} aria-label={label} aria-orientation={orientation} aria-valuemin={min} aria-valuemax={max} aria-valuenow={+value.toFixed(2)} aria-valuetext={format ? format(value) : undefined}
        className={cx('slider relative rounded-lg border border-line bg-panel2', vertical ? 'fader-track' : 'fader-track-h', highlight && 'tour-target', disabled && 'opacity-50')}
        style={vertical ? { width: thickness, height: length } : { width: length, height: thickness }}
        onPointerDown={onPointerDown} onPointerMove={onPointerMove} onPointerUp={onPointerUp} onPointerCancel={onPointerUp} onKeyDown={onKeyDown}>
        {tickEls}
        {center && (vertical
          ? <span className="absolute left-0 right-0 h-0.5 bg-neon/70" style={{ top: centerPos }} />
          : <span className="absolute top-0 bottom-0 w-0.5 bg-neon/70" style={{ left: centerPos }} />)}
        <span className="fader-cap absolute rounded-md" style={vertical
          ? { left: 4, right: 4, height: 18, top: capPos - 9, borderTop: `2px solid ${capColor || 'var(--neon)'}` }
          : { top: 4, bottom: 4, width: 18, left: capPos - 9, borderLeft: `2px solid ${capColor || 'var(--neon)'}` }} />
      </div>
      {format && <div className="font-mono text-[11px] text-fg/80 tabular">{format(value)}</div>}
    </div>
  );
}

function BeatLights({ beats, playing, size = 12 }) {
  const beat = Math.floor(beats), inBar = ((beat % 4) + 4) % 4, lit = playing && frac(beats) < 0.5;
  return (
    <div className="flex items-center gap-1.5" aria-label={`Beat ${inBar + 1} of 4`}>
      {[0, 1, 2, 3].map(i => (
        <span key={i} className={cx('led', lit && i === inBar && (i === 0 ? 'one' : 'on'))} style={{ width: size, height: size }} />
      ))}
    </div>
  );
}

/* ============================================================
   Waveform (canvas, 3-band coloured like a pro DJ app)
   ============================================================ */
function drawWave(canvas, deck, xfGain, t) {
  const dpr = window.devicePixelRatio || 1, w = canvas.clientWidth, h = canvas.clientHeight;
  if (!w || !h) return;
  if (canvas.width !== Math.round(w * dpr) || canvas.height !== Math.round(h * dpr)) { canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr); }
  const ctx = canvas.getContext('2d'); ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = '#0c0f15'; ctx.fillRect(0, 0, w, h);
  const headX = w * 0.3;
  if (!deck.track) {
    ctx.fillStyle = '#5f6880'; ctx.font = '600 11px JetBrains Mono, monospace'; ctx.textAlign = 'center';
    ctx.fillText('NO TRACK LOADED', w / 2, h / 2 + 4); return;
  }
  const beats = beatsOf(deck, t), beatsVisible = 16, pxPerBeat = w / beatsVisible, firstBeat = beats - headX / pxPerBeat;
  const stepW = pxPerBeat / 4;
  const g = { low: bandGain(deck.eq.low), mid: bandGain(deck.eq.mid), high: bandGain(deck.eq.high) };
  const vol = faderGain(deck.fader) * (0.35 + 0.65 * xfGain);
  const mid = h / 2;
  const s0 = Math.floor(firstBeat * 4) - 1, s1 = Math.ceil((firstBeat + beatsVisible) * 4) + 1;
  for (let s = s0; s <= s1; s++) {
    if (s < 0) continue;
    const x = (s / 4 - firstBeat) * pxPerBeat, a = stepAmps(deck.track.pattern, s);
    const hl = Math.min(1, a.low * g.low) * vol * h * 0.48, hm = Math.min(1, a.mid * g.mid) * vol * h * 0.34, hh = Math.min(1, a.high * g.high) * vol * h * 0.22;
    ctx.fillStyle = 'rgba(255,122,89,.92)'; ctx.fillRect(x, mid - hl, stepW - 1, hl * 2);
    ctx.fillStyle = 'rgba(95,224,165,.85)'; ctx.fillRect(x, mid - hm, stepW - 1, hm * 2);
    ctx.fillStyle = 'rgba(124,199,255,.85)'; ctx.fillRect(x, mid - hh, stepW - 1, hh * 2);
  }
  for (let b = Math.ceil(firstBeat); b <= firstBeat + beatsVisible; b++) {
    if (b < 0) continue;
    const x = (b - firstBeat) * pxPerBeat;
    if (b % 32 === 0) { ctx.strokeStyle = 'rgba(56,200,255,.9)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h); ctx.stroke();
      ctx.fillStyle = 'rgba(56,200,255,.95)'; ctx.font = '600 9px JetBrains Mono, monospace'; ctx.textAlign = 'left'; ctx.fillText('PHRASE ' + (b / 32 + 1), x + 4, 11); }
    else if (b % 4 === 0) { ctx.strokeStyle = 'rgba(233,237,245,.35)'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h); ctx.stroke(); }
    else { ctx.strokeStyle = 'rgba(233,237,245,.1)'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(x, h * 0.3); ctx.lineTo(x, h * 0.7); ctx.stroke(); }
  }
  ctx.fillStyle = 'rgba(0,0,0,.4)'; ctx.fillRect(0, 0, headX, h);
  ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(headX, 0); ctx.lineTo(headX, h); ctx.stroke();
}

function Waveform({ deck, xfGain, now }) {
  const ref = useRef(null);
  useEffect(() => { if (ref.current) drawWave(ref.current, deck, xfGain, now); });
  return <canvas ref={ref} className="wave-canvas" aria-label={`Deck ${deck.id} waveform`} />;
}

function PhraseStrip({ beats, highlight }) {
  const beat = Math.floor(beats), inPhrase = ((beat % 32) + 32) % 32, bar = Math.floor(inPhrase / 4), phrase = Math.floor(beat / 32) + 1;

              <span key={k} className={cx('h-2 flex-1 rounded-sm', idx === inPhrase ? 'bg-neon' : on ? 'bg-neon/35' : 'bg-line')} />); })}

/* ============================================================

        {SECTIONS.flatMap(sec => { const from = SECTIONS.indexOf(sec) === 0 ? 0 : SECTIONS[SECTIONS.indexOf(sec) - 1].until; return Array.from({ length: (sec.until - from) / 8 }, (_, k) => ({ name: sec.name, idx: from / 8 + k, bass: sec.bass })); }).map(p => (
          <div key={p.idx} title={`${p.name} · bars ${p.idx * 8 + 1}–${p.idx * 8 + 8}`} className={cx('h-5 rounded-md border text-center text-[8px] font-bold uppercase leading-5 tracking-wider', p.idx === seg ? 'border-neon bg-neon/25 text-neon' : p.idx < seg ? 'border-line2 bg-panel3 text-muted' : 'border-line text-dim')}>

function LevelMeter({ level }) {
  const segs = 10;
  return (
    <div className="flex h-[150px] w-3 flex-col-reverse gap-0.5 rounded-sm" aria-hidden="true">
      {Array.from({ length: segs }, (_, i) => {
        const on = level * segs > i;
        const color = i >= 8 ? 'var(--bad)' : i >= 6 ? 'var(--warn)' : 'var(--ok)';
        return <span key={i} className="flex-1 rounded-sm" style={{ background: on ? color : '#1b202b', boxShadow: on ? `0 0 6px ${color}` : 'none' }} />;
      })}
    </div>

}

function ChannelStrip({ deck, tgt, actions, level }) {
  const id = deck.id;
  return (
    <div className="flex flex-col items-center gap-3 rounded-xl border border-line bg-panel2 px-2 py-3">

}

function TempoMeter({ sim, now, highlight }) {
  const s = tempoStatus(sim, now);

  return (
    <div className={cx('rounded-xl border border-line bg-panel2 px-3 py-2', highlight && 'tour-target')}>
      <div className="mb-1 flex items-center justify-between text-[10px] font-semibold uppercase tracking-[0.18em] text-muted"><span>Tempo</span><span className="font-mono normal-case tracking-normal tabular">{s.dBpm > 0 ? '+' : ''}{s.dBpm.toFixed(1)}</span></div>
      <Gauge value={needle} color={s.tempoOk ? 'var(--ok)' : 'var(--warn)'} />
      <div className="mt-2 mb-1 flex items-center justify-between text-[10px] font-semibold uppercase tracking-[0.18em] text-muted"><span>Beat phase</span><span className="font-mono normal-case tracking-normal tabular">{s.both ? (s.phase >= 0 ? '+' : '') + s.phase.toFixed(2) : '—'}</span></div>

        <span className="flex items-center gap-1.5"><BeatLights beats={sim.decks.B.track ? beatsOf(sim.decks.B, now) : 0} playing={sim.decks.B.playing} size={9} />B</span>
      </div>
      <div className="mt-2 flex justify-center"><Chip tone={status.tone} className="whitespace-nowrap">{status.text}</Chip></div>
    </div>

}
function Gauge({ value, color }) {
  return (
    <div className="relative h-2.5 rounded-full bg-panel3">
      <span className="absolute left-1/2 top-0 h-full w-px bg-line2" />
      <span className="absolute top-0 h-full w-1.5 rounded-full" style={{ left: `calc(50% + ${value * 46}% - 3px)`, background: color, boxShadow: `0 0 8px ${color}` }} />
    </div>
  );
}

function MudMeter({ sim, highlight }) {
  const lv = bassLevels(sim), mud = Math.min(lv.A, lv.B);
  const state = mud < 0.2 ? { text: 'CLEAN', tone: 'ok', color: 'var(--ok)' } : mud < 0.5 ? { text: 'BUSY', tone: 'warn', color: 'var(--warn)' } : { text: 'MUDDY', tone: 'bad', color: 'var(--bad)' };
  const owner = lv.A < 0.15 && lv.B < 0.15 ? 'none' : lv.A > lv.B * 1.5 ? 'Deck A' : lv.B > lv.A * 1.5 ? 'Deck B' : 'both';
  return (
    <div className={cx('rounded-xl border border-line bg-panel2 px-3 py-2', highlight && 'tour-target')}>
      <div className="mb-1 flex items-center justify-between text-[10px] font-semibold uppercase tracking-[0.18em] text-muted"><span>Bass clash</span><Chip tone={state.tone}>{state.text}</Chip></div>
      <div className="h-2.5 overflow-hidden rounded-full bg-panel3"><div className="h-full rounded-full transition-[width] duration-100" style={{ width: `${Math.round(mud * 100)}%`, background: state.color, boxShadow: `0 0 8px ${state.color}` }} /></div>
      <div className="mt-1.5 flex flex-col gap-0.5 text-[11px] text-muted"><span>Bass from: <b className="text-fg">{owner}</b></span><span className="font-mono tabular">A {Math.round(lv.A * 100)} · B {Math.round(lv.B * 100)}</span></div>
    </div>
  );
}

function Mixer({ sim, now, tgt, actions, levels, className = '' }) {
  return (
    <Panel title="Mixer" icon="SlidersHorizontal" className={className}>
      <div className="flex items-start justify-center gap-3">
        <ChannelStrip deck={sim.decks.A} tgt={tgt} actions={actions} level={levels.A} />
        <div className="flex w-[160px] flex-col gap-2">
          <TempoMeter sim={sim} now={now} highlight={tgt('phase')} />
          <MudMeter sim={sim} highlight={tgt('mud')} />
        </div>
        <ChannelStrip deck={sim.decks.B} tgt={tgt} actions={actions} level={levels.B} />
      </div>
      <div className="mt-3 flex flex-col items-center gap-1">
        <Slider value={sim.xf} onChange={actions.setXf} orientation="horizontal" length={300} thickness={38} highlight={tgt('xf')} ticks={9} center={false} />
        <div className="flex w-[300px] max-w-full justify-between text-[10px] font-semibold uppercase tracking-[0.18em] text-muted"><span>Deck A</span><span>Crossfader</span><span>Deck B</span></div>
      </div>
    </Panel>

}

function outputLevels(sim, t, smooth) {
  const xg = xfGains(sim.xf), out = {};
  for (const id of ['A', 'B']) {
    const d = sim.decks[id]; let lv = 0;
    if (d.track && d.playing) {
      const step = Math.floor(beatsOf(d, t) * 4), a = stepAmps(d.track.pattern, step);

    const prev = smooth.current[id] || 0;
    out[id] = smooth.current[id] = lv > prev ? lv : prev * 0.85 + lv * 0.15;
  }
  return out;
}

function sectorPath(cxp, cyp, r0, r1, a0, a1) {
  const p = (r, a) => [cxp + r * Math.cos((a * Math.PI) / 180), cyp + r * Math.sin((a * Math.PI) / 180)];
  const [x0, y0] = p(r1, a0), [x1, y1] = p(r1, a1), [x2, y2] = p(r0, a1), [x3, y3] = p(r0, a0);
  return `M${x0},${y0} A${r1},${r1} 0 0 1 ${x1},${y1} L${x2},${y2} A${r0},${r0} 0 0 0 ${x3},${y3} Z`;
}
function CamelotWheel({ current, picks, onPick, highlight }) {
  const C = 150;
  const segs = [];
  for (let n = 1; n <= 12; n++) {
    const a0 = n * 30 - 90 - 15 + 1, a1 = n * 30 - 90 + 15 - 1, mid = n * 30 - 90;
    for (const [l, r0, r1] of [['B', 102, 142], ['A', 58, 98]]) {
      const key = `${n}${l}`, isCur = key === current, comp = current && compatibleKeys(current, key), picked = picks.includes(key);
      const rm = (r0 + r1) / 2, tx = C + rm * Math.cos((mid * Math.PI) / 180), ty = C + rm * Math.sin((mid * Math.PI) / 180);
      segs.push(
        <g key={key} onClick={() => onPick(key)} className="cursor-pointer" role="button" aria-label={`${key} ${keyInfo(key).name}`} tabIndex={0}
          onKeyDown={e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); onPick(key); } }}>
          <path d={sectorPath(C, C, r0, r1, a0, a1)}
            fill={isCur ? 'var(--neon)' : picked ? 'rgba(61,220,151,.35)' : comp ? 'rgba(56,200,255,.18)' : 'var(--panel-3)'}
            stroke={picked ? 'var(--ok)' : isCur ? 'var(--neon)' : 'var(--line-2)'} strokeWidth={picked || isCur ? 2 : 1} />
          <text x={tx} y={ty + 4} textAnchor="middle" fontSize={l === 'B' ? 12 : 11} fontWeight="700" fontFamily="JetBrains Mono, monospace"
            fill={isCur ? '#0a0c11' : comp || picked ? '#e9edf5' : '#8d96aa'}>{key}</text>
        </g>
      );
    }
  }
  return (
    <div className={cx('rounded-xl border border-line bg-panel2 p-2', highlight && 'tour-target')}>
      <svg viewBox="0 0 300 300" className="mx-auto block w-full max-w-[320px]" aria-label="Camelot wheel">
        {segs}
        <circle cx={C} cy={C} r={54} fill="var(--panel)" stroke="var(--line-2)" />
        <text x={C} y={C - 6} textAnchor="middle" fontSize="10" fill="#8d96aa" fontFamily="Manrope, sans-serif" fontWeight="700" letterSpacing="2">DECK A</text>
        <text x={C} y={C + 16} textAnchor="middle" fontSize="20" fill="#38c8ff" fontFamily="JetBrains Mono, monospace" fontWeight="600">{current || '—'}</text>
      </svg>
      <div className="mt-1 flex flex-wrap justify-center gap-x-4 gap-y-1 text-[10px] uppercase tracking-[0.18em] text-muted">
        <span>Inner ring = A = minor</span><span>Outer ring = B = major</span>
      </div>
    </div>
  );
}

const getPath = (sim, path) => {
  if (path === 'xf') return sim.xf;
  const [id, a, b] = path.split('.');
  return a === 'eq' ? sim.decks[id].eq[b] : sim.decks[id][a];
};

function useSim(initial) {
  const [sim, setSim] = useState(initial);
  const simRef = useRef(sim); simRef.current = sim;
  const setDeck = useCallback((id, patch) => setSim(s => { const d = s.decks[id]; const nd = typeof patch === 'function' ? patch(d, s) : { ...d, ...patch }; return nd === d ? s : { ...s, decks: { ...s.decks, [id]: nd } }; }), []);
  const actions = useMemo(() => ({
    setDeck,
    play: id => { engine.ensure(); setDeck(id, (d, s) => {
      if (!d.track || d.playing) return d;
      const t = nowMs(); let off = d.offsetBeats;
      const o = s.decks[id === 'A' ? 'B' : 'A'];
      if (d.autoSync && o.track && o.playing) off = Math.floor(off) + frac(beatsOf(o, t));
      return { ...d, playing: true, startedAt: t, offsetBeats: off }; }); },
    pause: id => setDeck(id, d => (d.playing ? { ...d, playing: false, offsetBeats: beatsOf(d, nowMs()) } : d)),
    cue: id => setDeck(id, d => ({ ...d, playing: false, offsetBeats: d.cueBeats })),
    nudge: (id, amt) => setDeck(id, d => { const r = rebase(d, nowMs()); return { ...r, offsetBeats: r.offsetBeats + amt }; }),
    setPitch: (id, v) => setDeck(id, d => ({ ...rebase(d, nowMs()), pitch: clamp(v, -8, 8) })),
    setEq: (id, band, v) => setDeck(id, d => ({ ...d, eq: { ...d.eq, [band]: clamp(v, -1, 1) } })),
    setFader: (id, v) => setDeck(id, d => ({ ...d, fader: clamp(v, 0, 1) })),
    setXf: v => setSim(s => ({ ...s, xf: clamp(v, 0, 1) })),
    sync: id => setDeck(id, (d, s) => {
      const o = s.decks[id === 'A' ? 'B' : 'A']; if (!d.track || !o.track) return d;
      const t = nowMs(); const nd = { ...rebase(d, t), pitch: clamp(pitchFor(effBpm(o), d.track.bpm), -8, 8) };
      if (d.playing && o.playing) nd.offsetBeats = Math.floor(nd.offsetBeats) + frac(beatsOf(o, t));
      return nd; }),
    load: (id, track) => setDeck(id, (d, s) => {
      const o = s.decks[id === 'A' ? 'B' : 'A'];
      const pitch = d.autoSync && o.track ? clamp(pitchFor(effBpm(o), track.bpm), -8, 8) : 0;
      return { ...d, track, playing: false, offsetBeats: 64, cueBeats: 64, pitch }; }),
    setPath: (path, v) => {
      if (path === 'xf') return actions.setXf(v);
      const [id, a, b] = path.split('.');
      if (a === 'eq') return actions.setEq(id, b, v);
      if (a === 'fader') return actions.setFader(id, v);
      if (a === 'pitch') return actions.setPitch(id, v);
    },
    stopAll: () => setSim(s => ({ ...s, decks: { A: { ...s.decks.A, playing: false, offsetBeats: beatsOf(s.decks.A, nowMs()) }, B: { ...s.decks.B, playing: false, offsetBeats: beatsOf(s.decks.B, nowMs()) } } })),
  }), [setDeck]);
  return [sim, setSim, simRef, actions];
}

function useFrameLoop(fps = 30) {
  const [frame, setFrame] = useState(0);
  useEffect(() => {
    let raf, last = 0; const gap = 1000 / fps;
    const loop = t => { raf = requestAnimationFrame(loop); if (t - last < gap) return; last = t; setFrame(f => f + 1); };
    raf = requestAnimationFrame(loop);
    return () => cancelAnimationFrame(raf);
  }, [fps]);
  return frame;
}

function LessonView({ lesson, progress, act, notify }) {
  const [sim, setSim, simRef, actions] = useSim(() => lesson.setup());
  const frame = useFrameLoop(30);
  const now = nowMs();
  const [tour, setTour] = useState({ active: false, step: 0, state: 'active', auto: false, finished: false, startBeats: 0, feedback: '' });
  const [picks, setPicks] = useState([]);
  const picksRef = useRef(picks); picksRef.current = picks;
  const [lastKey, setLastKey] = useState(null);
  const tourRef = useRef(tour); tourRef.current = tour;
  const mounted = useRef(true), stickyRef = useRef(null);
  const steps = lesson.steps;
  const lp = progress.lessons[lesson.id];

  useEffect(() => { mounted.current = true; engine.bind(() => simRef.current); return () => { mounted.current = false; engine.unbind(); }; }, []);

  const tgt = useCallback(id => tour.active && !tour.finished && tour.state === 'active' && steps[tour.step].targets.includes(id), [tour, steps]);

  useEffect(() => {
    if (!tour.active || tour.finished || tour.state !== 'active') return;
    const el = document.querySelector('.tour-target'); if (!el) return;
    const panelBottom = stickyRef.current ? stickyRef.current.getBoundingClientRect().bottom : 0;
    const r = el.getBoundingClientRect();
    const visible = r.top >= panelBottom + 8 && r.bottom <= window.innerHeight - 8;
    if (!visible) window.scrollTo({ top: window.scrollY + r.top - panelBottom - 20, behavior: 'smooth' });
  }, [tour.step, tour.active]);

  const beginStep = (idx, prev) => {
    const s = simRef.current, t = nowMs();
    const beatsA = s.decks.A.track ? beatsOf(s.decks.A, t) : 0;
    return { ...prev, active: true, finished: false, step: idx, state: 'active', auto: false, startBeats: beatsA, feedback: '' };
  };
  const startTour = () => {
    engine.ensure();
    setSim(lesson.setup()); setPicks([]);
    setTimeout(() => setTour(p => beginStep(0, p)), 0);
  };
  const restartTour = () => startTour();
  const advance = () => {
    const t = tourRef.current;
    if (t.step + 1 >= steps.length) {
      setTour(p => ({ ...p, finished: true, state: 'active', auto: false }));
      act({ type: 'tour', id: lesson.id });
      notify('Guided tour complete. Take the knowledge check to finish the lesson.', 'ok', 'CheckCircle2');
    } else setTour(p => beginStep(t.step + 1, p));
  };
  const completeStep = ctx => {
    const step = steps[tourRef.current.step];
    const feedback = step.onMet ? step.onMet(ctx) : 'Nice. That is exactly it.';
    setTour(p => ({ ...p, state: 'done', feedback }));
    setTimeout(() => { if (mounted.current && tourRef.current.state === 'done') advance(); }, 1300);
  };

  // Goal detection: runs every frame while a step is active and the user is in control
  useEffect(() => {
    const t = tourRef.current;
    if (!t.active || t.finished || t.state !== 'active' || t.auto) return;
    const step = steps[t.step]; if (!step.goal) return;
    const s = simRef.current, tm = nowMs();
    const ctx = { sim: s, now: tm, beatsA: s.decks.A.track ? beatsOf(s.decks.A, tm) : 0, beatsB: s.decks.B.track ? beatsOf(s.decks.B, tm) : 0, startBeats: t.startBeats, picks: picksRef.current };
    if (step.goal(ctx)) completeStep(ctx);
  }, [frame]);

  const api = useMemo(() => ({
    play: id => actions.play(id),
    setPath: actions.setPath,
    sleep,
    tween: (path, to, ms) => new Promise(res => {
      const from = getPath(simRef.current, path), t0 = nowMs();
      const step = () => { if (!mounted.current) return res(); const k = clamp((nowMs() - t0) / ms, 0, 1); actions.setPath(path, lerp(from, to, easeInOut(k))); if (k < 1) requestAnimationFrame(step); else res(); };
      requestAnimationFrame(step);
    }),
    waitForBeatOne: id => new Promise(res => {
      const d = simRef.current.decks[id]; if (!d.playing) return res();
      const b = beatsOf(d, nowMs()), next = Math.ceil(b / 4) * 4; setTimeout(res, Math.max(0, ((next - b) / effBpm(d)) * 60000 - 20));
    }),
    alignPhase: id => { const s = simRef.current, o = id === 'A' ? 'B' : 'A', t = nowMs(); const bo = beatsOf(s.decks[o], t); actions.setDeck(id, d => { const r = rebase(d, t); return { ...r, offsetBeats: Math.floor(r.offsetBeats) + frac(bo) }; }); return sleep(400); },
    pickKeys: async keys => { for (const k of keys) { setPicks(p => (p.includes(k) ? p : [...p, k])); setLastKey(k); await sleep(400); } },
    load: (id, trackId) => { actions.load(id, TRACKS[trackId]); return sleep(400); },
  }), [actions]);

  const nextStep = async () => {
    const t = tourRef.current; if (t.auto || t.state !== 'active') return;
    const step = steps[t.step];
    if (step.run) {
      setTour(p => ({ ...p, auto: true }));
      try { await step.run(api); } catch (e) { /* ignore */ }
      if (!mounted.current || tourRef.current.step !== t.step) return;
      const s = simRef.current, tm = nowMs();
      const ctx = { sim: s, now: tm, beatsA: s.decks.A.track ? beatsOf(s.decks.A, tm) : 0, beatsB: 0, startBeats: t.startBeats, picks: picksRef.current };
      setTour(p => ({ ...p, auto: false }));
      completeStep(ctx);
    } else advance();
  };

  const onPickKey = key => {
    setLastKey(key);
    const cur = sim.decks.A.track ? sim.decks.A.track.key : null;
    const t = tourRef.current, wheelStep = t.active && !t.finished && steps[t.step].targets.includes('wheel') && !!steps[t.step].goal;
    if (cur && key === cur) return;
    if (cur && !compatibleKeys(cur, key)) { if (wheelStep) notify(`${key} is ${keyRelation(cur, key).toLowerCase()} with ${cur}. Not that one.`, 'bad', 'X'); return; }
    setPicks(p => (p.includes(key) ? p.filter(k => k !== key) : [...p, key]));
  };
  const onLoadTrack = track => {
    actions.load('B', track);
    const cur = sim.decks.A.track ? sim.decks.A.track.key : null;
    if (cur) notify(compatibleKeys(cur, track.key) ? `${track.title} is in ${track.key}: ${keyRelation(cur, track.key).toLowerCase()}. Good pick.` : `${track.title} is in ${track.key}: ${keyRelation(cur, track.key).toLowerCase()} with ${cur}. Try another.`, compatibleKeys(cur, track.key) ? 'ok' : 'bad');
  };

  const curKey = sim.decks.A.track ? sim.decks.A.track.key : null;
  return (
    <div className="flex flex-col gap-5">
      <header className="flex flex-col gap-2">
        <div className="flex flex-wrap items-center gap-2">
          <Chip tone="neon">Lesson {lesson.id} of {LESSONS.length}</Chip>
          {lp.done ? <Chip tone="ok"><Icon name="Check" size={11} />Complete</Chip> : lp.tour ? <Chip tone="warn">Tour done · quiz pending</Chip> : <Chip>In progress</Chip>}
        </div>
        <h1 className="font-display text-2xl font-bold sm:text-3xl">{lesson.title}</h1>
        <p className="max-w-prose text-[15px] text-muted">{lesson.subtitle}. {lesson.intro}</p>
      </header>

      <section className="flex flex-col gap-3">
        <h2 className="text-[11px] font-semibold uppercase tracking-[0.18em] text-muted">1 · Learn the idea</h2>
        <ConceptCards lesson={lesson} />
      </section>

      <section className="flex flex-col gap-3">
        <h2 className="text-[11px] font-semibold uppercase tracking-[0.18em] text-muted">2 · Follow me on the controller</h2>
        <div ref={stickyRef} className={cx(tour.active && !tour.finished && 'sticky z-20')} style={{ top: 'calc(env(safe-area-inset-top, 0px) + 54px)' }}>
          <Instructor lesson={lesson} tour={tour} steps={steps} onStart={startTour} onNext={nextStep} onRestart={restartTour} tourDoneBefore={lp.tour} />
        </div>
        <Controller sim={sim} now={now} tgt={tgt} actions={actions} syncDisabled={lesson.id === 2} />
        {lesson.id === 4 && (
          <div className="grid gap-3 lg:grid-cols-2">
            <Panel title="Camelot wheel" icon="Compass" right={lastKey && curKey && <Chip tone={compatibleKeys(curKey, lastKey) ? 'ok' : 'bad'}>{lastKey} · {keyInfo(lastKey).name} · {keyRelation(curKey, lastKey)}</Chip>}>
              <CamelotWheel current={curKey} picks={picks} onPick={onPickKey} highlight={tgt('wheel')} />
            </Panel>
            <Panel title="Crate · load onto Deck B" icon="Layers">
              <Crate currentKey={curKey} deckB={sim.decks.B} onLoad={onLoadTrack} highlight={tgt('crate')} />
            </Panel>
          </div>
        )}
      </section>

      <section id="knowledge-check" className="flex flex-col gap-3 scroll-mt-4">
        <h2 className="text-[11px] font-semibold uppercase tracking-[0.18em] text-muted">3 · Knowledge check</h2>
        <Panel>
          {lp.tour || tour.finished
            ? <Quiz key={lesson.id} questions={lesson.quiz} passed={lp.done} onPass={() => { act({ type: 'quiz', id: lesson.id }); }} />
            : <div className="flex items-center gap-3 text-muted"><Icon name="Lock" size={18} /><span>Finish the guided tour above to unlock the three-question check. Pass it to complete the lesson{lesson.id < 4 ? ' and unlock the next one' : ''}.</span></div>}
        </Panel>
      </section>
    </div>
  );
}

/* ============================================================
   Drill 1: Phrase Drop Challenge
   ============================================================ */
const PHRASE_TARGETS = [32, 64, 96, 128];
const gradeFor = ms => (ms == null ? { label: 'Missed', pts: 0, tone: 'bad' } : Math.abs(ms) <= 70 ? { label: 'Excellent', pts: 100, tone: 'ok' } : Math.abs(ms) <= 180 ? { label: 'Good', pts: 60, tone: 'warn' } : { label: 'Missed', pts: 0, tone: 'bad' });

function drawRunway(canvas, b, drops, flash) {
  const dpr = window.devicePixelRatio || 1, w = canvas.clientWidth, h = canvas.clientHeight;
  if (!w || !h) return;
  if (canvas.width !== Math.round(w * dpr) || canvas.height !== Math.round(h * dpr)) { canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr); }
  const ctx = canvas.getContext('2d'); ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = '#0c0f15'; ctx.fillRect(0, 0, w, h);
  const headX = w * 0.22, ahead = 10, px = (w - headX) / ahead;
  for (let beat = Math.floor(b - 3); beat <= b + ahead + 1; beat++) {
    const x = headX + (beat - b) * px; if (x < -20 || x > w + 20) continue;
    const isPhrase = beat % 32 === 0 && beat > 0, isBar = beat % 4 === 0;
    if (isPhrase) {
      const scored = drops[beat];
      ctx.fillStyle = scored ? (scored.grade.tone === 'ok' ? 'rgba(61,220,151,.9)' : scored.grade.tone === 'warn' ? 'rgba(255,180,84,.9)' : 'rgba(255,92,122,.9)') : 'rgba(56,200,255,.95)';
      ctx.fillRect(x - 3, 6, 6, h - 12);
      ctx.font = '700 10px JetBrains Mono, monospace'; ctx.textAlign = 'center'; ctx.fillText(scored ? scored.grade.label.toUpperCase() : 'DROP', x, h - 4);
    } else if (isBar) { ctx.fillStyle = 'rgba(233,237,245,.55)'; ctx.fillRect(x - 1, h * 0.25, 2, h * 0.5); }
    else { ctx.fillStyle = 'rgba(233,237,245,.18)'; ctx.fillRect(x - 0.5, h * 0.4, 1, h * 0.2); }
  }
  ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.fillRect(0, 0, headX, h);
  ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(headX, 0); ctx.lineTo(headX, h); ctx.stroke();
  const pulse = 1 - frac(b);
  ctx.fillStyle = `rgba(56,200,255,${0.15 + 0.4 * pulse})`; ctx.beginPath(); ctx.arc(headX, h / 2, 8 + 10 * pulse, 0, Math.PI * 2); ctx.fill();
  if (flash && nowMs() < flash.until) {
    ctx.fillStyle = flash.color; ctx.font = '700 18px Unbounded, Manrope, sans-serif'; ctx.textAlign = 'left'; ctx.fillText(flash.text, headX + 16, h / 2 - 6);
    ctx.fillStyle = '#8d96aa'; ctx.font = '600 11px JetBrains Mono, monospace'; ctx.fillText(flash.sub, headX + 16, h / 2 + 12);
  }
}

function PhraseDrop({ act, notify }) {
  const [bpm, setBpm] = useState(128);
  const [phase, setPhase] = useState('idle');
  const frame = useFrameLoop(60);
  const st = useRef(null), canvasRef = useRef(null), [result, setResult] = useState(null);
  const beatAt = t => (st.current ? 24 + ((t - st.current.startAt) / 60000) * bpm : 0);

  const start = () => {
    engine.ensure();
    st.current = { startAt: nowMs() + 600, drops: {}, flash: null, lastFalse: 0 };
    setResult(null); setPhase('running');
  };
  const finish = () => {
    const s = st.current; const drops = PHRASE_TARGETS.map(t => s.drops[t]);
    const points = drops.reduce((a, d) => a + d.grade.pts, 0), pct = Math.round((points / (PHRASE_TARGETS.length * 100)) * 100);
    const hits = drops.filter(d => d.ms != null), avgAbs = hits.length ? Math.round(hits.reduce((a, d) => a + Math.abs(d.ms), 0) / hits.length) : null;
    const round = { pct, points, avgAbs, bpm, drops: drops.map(d => ({ target: d.target, ms: d.ms, grade: d.grade.label })), at: Date.now() };
    setResult(round); setPhase('result');
    act({ type: 'phrase', round });
  };
  const hit = () => {
    const s = st.current; if (!s || phase !== 'running') return;
    const t = nowMs(), b = beatAt(t), nearest = Math.round(b / 32) * 32;
    if (nearest < 32 || !PHRASE_TARGETS.includes(nearest)) { s.flash = { text: 'Too early', sub: 'Wait for the DROP marker to reach the line', color: '#ffb454', until: t + 900 }; return; }
    if (s.drops[nearest]) { s.flash = { text: 'Already dropped', sub: 'Wait for the next phrase', color: '#8d96aa', until: t + 900 }; return; }
    const ms = Math.round(((b - nearest) / bpm) * 60000), grade = gradeFor(ms);
    s.drops[nearest] = { target: nearest, ms, grade };
    s.flash = { text: grade.label, sub: `${Math.abs(ms)} ms ${ms >= 0 ? 'late' : 'early'} · +${grade.pts}`, color: grade.tone === 'ok' ? '#3ddc97' : grade.tone === 'warn' ? '#ffb454' : '#ff5c7a', until: t + 1100 };
  };
  // auto-miss + end of round + draw
  useEffect(() => {
    const s = st.current; if (!s) return;
    if (phase === 'running') {
      const b = beatAt(nowMs());
      for (const tgt of PHRASE_TARGETS) if (!s.drops[tgt] && b > tgt + 0.6) { s.drops[tgt] = { target: tgt, ms: null, grade: gradeFor(null) }; s.flash = { text: 'Missed', sub: 'No CUE on the phrase start', color: '#ff5c7a', until: nowMs() + 1000 }; }
      if (PHRASE_TARGETS.every(t => s.drops[t]) && b > 128 + 2) finish();
    }
    if (canvasRef.current) drawRunway(canvasRef.current, phase === 'running' ? beatAt(nowMs()) : 24, s.drops, s.flash);
  }, [frame, phase]);
  // metronome + groove scheduling
  useEffect(() => {
    if (phase !== 'running' || !engine.ctx) return;
    let cursor = null;
    const iv = setInterval(() => {
      const t = nowMs(), b = beatAt(t), spb = 60 / bpm;
      if (cursor == null || cursor < b - 0.5) cursor = Math.ceil(b);
      const horizon = b + 0.2 / spb;
      while (cursor <= horizon) {
        const perf = st.current.startAt + ((cursor - 24) / bpm) * 60000;
        const at = engine.toAudio(perf);
        if (at >= engine.ctx.currentTime - 0.01) engine.drillBeat(at, cursor, spb);
        cursor++;
      }
    }, 30);
    return () => clearInterval(iv);
  }, [phase, bpm]);
  useEffect(() => {
    const onKey = e => { if (e.code === 'Space' && phase === 'running') { e.preventDefault(); hit(); } };
    window.addEventListener('keydown', onKey); return () => window.removeEventListener('keydown', onKey);
  });

  const b = phase === 'running' ? beatAt(nowMs()) : 24;
  const inPhrase = ((Math.floor(b) % 32) + 32) % 32, bar = Math.floor(inPhrase / 4) + 1, beat = (inPhrase % 4) + 1;
  const nextTarget = st.current ? PHRASE_TARGETS.find(t => !st.current.drops[t]) : 32;
  const toGo = nextTarget != null ? Math.max(0, Math.ceil(nextTarget - b)) : 0;
  const dropsSoFar = st.current ? PHRASE_TARGETS.filter(t => st.current.drops[t]).map(t => st.current.drops[t]) : [];

  return (
    <div className="flex flex-col gap-4">
      <div className="flex flex-col gap-2 sm:flex-row sm:items-end sm:justify-between">
        <div>
          <h2 className="font-display text-xl font-bold">Phrase Drop Challenge</h2>
          <p className="max-w-prose text-sm text-muted">A beat clock runs through 32-beat phrases. Hit CUE (or the space bar) exactly on beat 1 of each new phrase. Four drops per round. Within 70 ms is Excellent, within 180 ms is Good, anything else is a miss.</p>
        </div>
        <div className="flex items-center gap-2">
          <label className="text-xs text-muted" htmlFor="phrase-bpm">Tempo</label>
          <select id="phrase-bpm" value={bpm} onChange={e => setBpm(+e.target.value)} disabled={phase === 'running'} className="rounded-lg border border-line2 bg-panel3 px-2 py-1.5 font-mono text-sm">
            {[120, 124, 128, 132, 136, 140].map(v => <option key={v} value={v}>{v} BPM</option>)}
          </select>
        </div>
      </div>

      <div className="grid gap-3 lg:grid-cols-[minmax(0,1fr)_280px]">
        <Panel title="Runway" icon="Activity" right={<Chip tone={phase === 'running' ? 'neon' : 'muted'}>{phase === 'running' ? 'LIVE' : phase === 'result' ? 'Round over' : 'Ready'}</Chip>}>
          <div className="flex flex-col gap-3">
            <div className="h-[120px] overflow-hidden rounded-xl border border-line"><canvas ref={canvasRef} className="wave-canvas" aria-label="Phrase runway" /></div>
            <div className="grid grid-cols-3 gap-2 text-center">
              <div className="rounded-xl border border-line bg-panel2 py-2"><div className="text-[10px] uppercase tracking-[0.18em] text-muted">Bar</div><div className="font-mono text-2xl font-semibold tabular text-neon">{bar}<span className="text-sm text-muted">/8</span></div></div>
              <div className="rounded-xl border border-line bg-panel2 py-2"><div className="text-[10px] uppercase tracking-[0.18em] text-muted">Beat</div><div className="font-mono text-2xl font-semibold tabular">{beat}</div></div>
              <div className="rounded-xl border border-line bg-panel2 py-2"><div className="text-[10px] uppercase tracking-[0.18em] text-muted">Drop in</div><div className={cx('font-mono text-2xl font-semibold tabular', toGo <= 4 ? 'text-warn' : '')}>{phase === 'running' && nextTarget != null ? toGo : '—'}</div></div>
            </div>
            <div className="grid grid-cols-8 gap-1" aria-hidden="true">
              {Array.from({ length: 32 }, (_, i) => <span key={i} className={cx('h-2.5 rounded-sm', phase === 'running' && i === inPhrase ? (i % 4 === 0 ? 'bg-warn' : 'bg-neon') : phase === 'running' && i < inPhrase ? 'bg-neon/35' : 'bg-line')} />)}
            </div>
            <div className="flex flex-wrap items-center gap-3">
              {phase === 'running'
                ? <button type="button" onClick={hit} className="btn-press flex h-20 w-full items-center justify-center gap-3 rounded-2xl bg-neon font-display text-2xl font-bold text-bg shadow-glow sm:w-64"><Icon name="Crosshair" size={26} />CUE</button>
                : <Button tone="primary" size="lg" icon="Play" onClick={start}>{phase === 'result' ? 'Play again' : 'Start round'}</Button>}
              <span className="text-xs text-muted">{phase === 'running' ? 'Space bar works too. Listen for the accent click on the one.' : 'Four phrases. The first drop comes after 8 beats of count-in.'}</span>
            </div>
          </div>
        </Panel>
        <Panel title="This round" icon="ListChecks">
          <div className="flex flex-col gap-2">
            {PHRASE_TARGETS.map((t, i) => { const d = dropsSoFar.find(x => x.target === t); return (
              <div key={t} className="flex items-center justify-between rounded-lg border border-line bg-panel2 px-3 py-2 text-sm">
                <span className="text-muted">Drop {i + 1}</span>
                {d ? <span className="flex items-center gap-2"><span className="font-mono text-xs tabular text-muted">{d.ms == null ? '—' : `${Math.abs(d.ms)} ms ${d.ms >= 0 ? 'late' : 'early'}`}</span><Chip tone={d.grade.tone}>{d.grade.label}</Chip></span> : <Chip>pending</Chip>}
              </div>); })}
            {result && (
              <div className="mt-2 rounded-xl border border-neon/40 bg-neon/5 p-3 rise">
                <div className="text-[10px] uppercase tracking-[0.18em] text-muted">Round score</div>
                <div className="font-display text-3xl font-bold text-neon">{result.pct}%</div>
                <div className="text-xs text-muted">{result.avgAbs != null ? `Average ${result.avgAbs} ms off the one.` : 'No drops landed.'} {result.pct >= 90 ? 'Phrase Master territory.' : result.pct >= 60 ? 'Solid. Tighten up for the badge at 90%.' : 'Count out loud with the clicks and try again.'}</div>
              </div>
            )}
          </div>
        </Panel>
      </div>
    </div>
  );
}

/* ============================================================
   Drill 2: Ear Training Equalizer
   ============================================================ */
const EAR_LIMIT = 15, EAR_ROUNDS = 3;
function earSetup(dominant) {
  const t = nowMs();
  const dom = pick([-0.6, 0.7, -0.35, 0.5]), oth = pick([0, 0.4, -0.3, 0.2]);
  const mk = (id, track, low) => makeDeck(id, track, { playing: true, startedAt: t, offsetBeats: 64, cueBeats: 64, fader: 1, eq: { low, mid: 0, high: 0 } });
  return { decks: { A: mk('A', TRACKS.nightShift, dominant === 'A' ? dom : oth), B: mk('B', TRACKS.saltwater, dominant === 'B' ? dom : oth) }, xf: 0.5 };
}
function EarTraining({ act, notify }) {
  const [sim, setSim, simRef, actions] = useSim(() => ({ decks: { A: makeDeck('A', TRACKS.nightShift, { offsetBeats: 64 }), B: makeDeck('B', TRACKS.saltwater, { offsetBeats: 64 }) }, xf: 0.5 }));
  const frame = useFrameLoop(30);
  const [phase, setPhase] = useState('idle');
  const [round, setRound] = useState(0), [dominant, setDominant] = useState('A'), [results, setResults] = useState([]);
  const rr = useRef({ startAt: 0, holdSince: null }), mounted = useRef(true);
  const [summary, setSummary] = useState(null);
  useEffect(() => { mounted.current = true; engine.bind(() => simRef.current); return () => { mounted.current = false; engine.unbind(); }; }, []);

  const beginRound = i => {
    const dom = Math.random() < 0.5 ? 'A' : 'B';
    setDominant(dom); setRound(i); setSim(earSetup(dom)); rr.current = { startAt: nowMs(), holdSince: null }; setPhase('running');
  };
  const startRun = () => { engine.ensure(); setResults([]); setSummary(null); beginRound(0); };
  const endRound = (success, time) => {
    const next = [...results, { success, time, dominant }];
    setResults(next); setPhase('between');
    setTimeout(() => {
      if (!mounted.current) return;
      if (next.length >= EAR_ROUNDS) {
        actions.stopAll();
        const ok = next.filter(r => r.success), allOk = ok.length === EAR_ROUNDS;
        const avg = ok.length ? +(ok.reduce((a, r) => a + r.time, 0) / ok.length).toFixed(1) : null;
        const roundRec = { success: allOk, avg, results: next.map(r => ({ success: r.success, time: r.time })), at: Date.now() };
        setSummary(roundRec); setPhase('result'); act({ type: 'ear', round: roundRec });
      } else beginRound(next.length);
    }, 1400);
  };
  const other = dominant === 'A' ? 'B' : 'A';
  const goalMet = s => Math.abs(s.decks[dominant].eq.low) <= 0.12 && s.decks[other].eq.low <= -0.9;
  useEffect(() => {
    if (phase !== 'running') return;
    const t = nowMs(), elapsed = (t - rr.current.startAt) / 1000;
    if (goalMet(simRef.current)) {
      if (rr.current.holdSince == null) rr.current.holdSince = t;
      else if (t - rr.current.holdSince >= 700) endRound(true, +(elapsed - 0.7).toFixed(1));
    } else rr.current.holdSince = null;
    if (elapsed >= EAR_LIMIT && phase === 'running' && rr.current.holdSince == null) endRound(false, EAR_LIMIT);
  }, [frame]);

  const elapsed = phase === 'running' ? (nowMs() - rr.current.startAt) / 1000 : 0;
  const remaining = clamp(EAR_LIMIT - elapsed, 0, EAR_LIMIT);
  const lv = bassLevels(sim), mud = Math.min(lv.A, lv.B);
  const holding = phase === 'running' && rr.current.holdSince != null;
  const ringR = 44, circ = 2 * Math.PI * ringR;
  const lowOk = id => (id === dominant ? Math.abs(sim.decks[id].eq.low) <= 0.12 : sim.decks[id].eq.low <= -0.9);

  return (
    <div className="flex flex-col gap-4">
      <div>
        <h2 className="font-display text-xl font-bold">Ear Training Equalizer</h2>
        <p className="max-w-prose text-sm text-muted">Two tracks play with their basslines fighting. The dominant track is the one the crowd is dancing to. Turn its LOW knob to 12 o'clock and KILL the other deck's LOW. Three rounds, 15 seconds each. Hold the clean setting for a moment to lock it in.</p>
      </div>
      <div className="grid gap-3 lg:grid-cols-[minmax(0,1fr)_280px]">
        <Panel title={phase === 'running' || phase === 'between' ? `Round ${round + 1} of ${EAR_ROUNDS}` : 'Mixer · low band'} icon="Ear"
          right={phase === 'running' && <Chip tone={holding ? 'ok' : 'neon'}>{holding ? 'Hold it…' : `Keep DECK ${dominant}`}</Chip>}>
          <div className="flex flex-col items-center gap-5">
            {phase === 'running' || phase === 'between' ? (
              <div className="w-full rounded-xl border border-neon/40 bg-neon/5 px-4 py-3 text-center">
                <div className="text-[11px] font-semibold uppercase tracking-[0.18em] text-neon">Crowd is dancing to Deck {dominant}</div>
                <div className="text-sm text-muted">Deck {dominant} LOW to 12 o'clock (0 dB) · Deck {other} LOW to KILL</div>
              </div>
            ) : (
              <div className="w-full rounded-xl border border-line bg-panel2 px-4 py-3 text-center text-sm text-muted">Press start. Each round picks a new dominant deck and scrambles the knobs.</div>
            )}
            <div className="flex w-full flex-wrap items-center justify-center gap-6 sm:gap-10">
              <div className={cx('flex flex-col items-center gap-2 rounded-2xl border px-5 py-4 transition-colors', phase === 'running' ? (lowOk('A') ? 'border-ok/60 bg-ok/5' : 'border-line bg-panel2') : 'border-line bg-panel2')}>
                <div className="text-[11px] font-semibold uppercase tracking-[0.18em] text-muted">Deck A {phase === 'running' && dominant === 'A' && <span className="text-neon">· keep</span>}</div>
                <Knob value={sim.decks.A.eq.low} onChange={v => actions.setEq('A', 'low', v)} label="Low" color="var(--low)" size={96} disabled={phase !== 'running'} highlight={phase === 'running' && !lowOk('A')} />
              </div>
              <div className="flex flex-col items-center gap-2">
                <svg width="110" height="110" viewBox="0 0 110 110" aria-label={`${Math.ceil(remaining)} seconds left`}>
                  <circle cx="55" cy="55" r={ringR} fill="none" stroke="var(--line-2)" strokeWidth="8" />
                  <circle cx="55" cy="55" r={ringR} fill="none" stroke={remaining < 5 ? 'var(--bad)' : holding ? 'var(--ok)' : 'var(--neon)'} strokeWidth="8" strokeLinecap="round"
                    strokeDasharray={circ} strokeDashoffset={circ * (1 - remaining / EAR_LIMIT)} transform="rotate(-90 55 55)" />
                  <text x="55" y="62" textAnchor="middle" fontSize="24" fontWeight="600" fontFamily="JetBrains Mono, monospace" fill="#e9edf5">{phase === 'running' ? Math.ceil(remaining) : EAR_LIMIT}</text>
                </svg>
                <div className="text-[10px] uppercase tracking-[0.18em] text-muted">seconds</div>
              </div>
              <div className={cx('flex flex-col items-center gap-2 rounded-2xl border px-5 py-4 transition-colors', phase === 'running' ? (lowOk('B') ? 'border-ok/60 bg-ok/5' : 'border-line bg-panel2') : 'border-line bg-panel2')}>
                <div className="text-[11px] font-semibold uppercase tracking-[0.18em] text-muted">Deck B {phase === 'running' && dominant === 'B' && <span className="text-neon">· keep</span>}</div>
                <Knob value={sim.decks.B.eq.low} onChange={v => actions.setEq('B', 'low', v)} label="Low" color="var(--low)" size={96} disabled={phase !== 'running'} highlight={phase === 'running' && !lowOk('B')} />
              </div>
            </div>
            <div className="w-full max-w-md"><MudMeter sim={sim} /></div>
            <div className="flex w-full max-w-md items-end justify-center gap-6" aria-hidden="true">
              {['A', 'B'].map(id => { const d = sim.decks[id]; const step = Math.floor(beatsOf(d, nowMs()) * 4); const a = d.playing ? stepAmps(d.track.pattern, step).low * bandGain(d.eq.low) * faderGain(d.fader) : 0; return (
                <div key={id} className="flex flex-col items-center gap-1"><div className="flex h-16 w-10 items-end overflow-hidden rounded-md bg-panel3"><div className="w-full rounded-t-md bg-low transition-[height] duration-75" style={{ height: `${Math.round(Math.min(1, a) * 100)}%`, opacity: 0.9 }} /></div><span className="text-[10px] uppercase tracking-[0.18em] text-muted">Bass {id}</span></div>); })}
            </div>
            {phase !== 'running' && phase !== 'between' && <Button tone="primary" size="lg" icon="Play" onClick={startRun}>{phase === 'result' ? 'Play again' : 'Start 3 rounds'}</Button>}
          </div>
        </Panel>
        <Panel title="Rounds" icon="ListChecks">
          <div className="flex flex-col gap-2">
            {Array.from({ length: EAR_ROUNDS }, (_, i) => { const r = results[i]; return (
              <div key={i} className="flex items-center justify-between rounded-lg border border-line bg-panel2 px-3 py-2 text-sm">
                <span className="text-muted">Round {i + 1}{r && <span className="ml-1 text-xs">· keep {r.dominant}</span>}</span>
                {r ? <span className="flex items-center gap-2"><span className="font-mono text-xs tabular text-muted">{r.success ? `${r.time.toFixed(1)} s` : 'time up'}</span><Chip tone={r.success ? (r.time < 5 ? 'ok' : 'neon') : 'bad'}>{r.success ? (r.time < 5 ? 'Sharp' : 'Clean') : 'Muddy'}</Chip></span> : <Chip>{phase === 'running' && i === round ? 'live' : 'pending'}</Chip>}
              </div>); })}
            {summary && (
              <div className={cx('mt-2 rounded-xl border p-3 rise', summary.success ? 'border-ok/40 bg-ok/5' : 'border-warn/40 bg-warn/5')}>
                <div className="text-[10px] uppercase tracking-[0.18em] text-muted">Result</div>
                <div className={cx('font-display text-2xl font-bold', summary.success ? 'text-ok' : 'text-warn')}>{summary.success ? 'Clean transitions' : `${summary.results.filter(r => r.success).length} of ${EAR_ROUNDS} clean`}</div>
                <div className="text-xs text-muted">{summary.avg != null ? `Average ${summary.avg} s per clean round.` : 'No clean rounds yet.'} {summary.success && summary.avg < 5 ? 'Sharp ears.' : summary.success ? 'Under 5 s average earns Sharp Ears.' : 'Kill the wrong bass first, then centre the right one.'}</div>
              </div>
            )}
          </div>
        </Panel>
      </div>
    </div>
  );
}

function Ring({ value, size = 64, stroke = 7, color = 'var(--neon)', children }) {
  const r = (size - stroke) / 2, c = 2 * Math.PI * r;
  return (
    <div className="relative grid place-items-center" style={{ width: size, height: size }}>
      <svg width={size} height={size} aria-hidden="true">
        <circle cx={size / 2} cy={size / 2} r={r} fill="none" stroke="var(--line-2)" strokeWidth={stroke} />
        <circle cx={size / 2} cy={size / 2} r={r} fill="none" stroke={color} strokeWidth={stroke} strokeLinecap="round" strokeDasharray={c} strokeDashoffset={c * (1 - clamp(value, 0, 1))} transform={`rotate(-90 ${size / 2} ${size / 2})`} />
      </svg>
      <div className="absolute inset-0 grid place-items-center">{children}</div>
    </div>
  );
}
