  );
}

function Toasts({ toasts }) {
  const tone = { info: 'border-neon/50', ok: 'border-ok/60', bad: 'border-bad/60', badge: 'border-warn/70', warn: 'border-warn/60' };
  const color = { info: 'text-neon', ok: 'text-ok', bad: 'text-bad', badge: 'text-warn', warn: 'text-warn' };
  return (
    <div className="pointer-events-none fixed bottom-4 right-4 z-50 flex w-[min(360px,calc(100vw-32px))] flex-col gap-2" style={{ bottom: 'calc(16px + env(safe-area-inset-bottom, 0px))', right: 'max(16px, env(safe-area-inset-right, 0px))' }} aria-live="polite">
      {toasts.map(t => (
        <div key={t.id} className={cx('rise flex items-start gap-2 rounded-xl border bg-panel2/95 px-3 py-2 text-sm shadow-lg backdrop-blur', tone[t.kind] || tone.info)}>
          <Icon name={t.icon || (t.kind === 'badge' ? 'Award' : t.kind === 'ok' ? 'CheckCircle2' : t.kind === 'bad' ? 'X' : 'Info')} size={16} className={cx('mt-0.5 shrink-0', color[t.kind] || color.info)} />
          <span>{t.msg}</span>
        </div>
      ))}
    </div>
  );
}

const hashFor = v => (v.type === 'lesson' ? `#lesson-${v.id}` : `#${v.type}`);
const viewFromHash = () => {
  const h = (window.location.hash || '').replace('#', '');
  const m = h.match(/^lesson-(\d)$/); if (m && lessonById(+m[1])) return { type: 'lesson', id: +m[1] };
  if (h === 'drills' || h === 'dashboard') return { type: h };
  return null;
};

function App() {
  const [progress, setProgress] = useState(loadProgress);
  const progressRef = useRef(progress); progressRef.current = progress;
  const [view, setView] = useState(() => viewFromHash() || { type: 'lesson', id: 1 });
  const [toasts, setToasts] = useState([]);
  const [soundOn, setSoundOn] = useState(true);
  const [navOpen, setNavOpen] = useState(false);
  const unlocked = id => id === 1 || progressRef.current.lessons[id - 1].done;
  const viewOk = v => (v.type !== 'lesson' || unlocked(v.id));
  useEffect(() => { saveProgress(progress); }, [progress]);
  useEffect(() => {
    const h = hashFor(view);
    if (window.location.hash !== h) { try { window.location.hash = h; } catch (e) { /* hash routing unavailable */ } }
  }, [view]);
  useEffect(() => {
    const onHash = () => { const v = viewFromHash(); if (v && viewOk(v)) setView(v); };
    window.addEventListener('hashchange', onHash); return () => window.removeEventListener('hashchange', onHash);
  }, []);
  useEffect(() => { if (!viewOk(view)) setView({ type: 'lesson', id: 1 }); }, []);

  const notify = useCallback((msg, kind = 'info', icon) => {
    const id = Math.random().toString(36).slice(2);
    setToasts(t => [...t.slice(-3), { id, msg, kind, icon }]);
    setTimeout(() => setToasts(t => t.filter(x => x.id !== id)), 3600);
  }, []);
  const act = useCallback(action => {
    const { next, earned, xp } = applyProgress(progressRef.current, action);
    progressRef.current = next; setProgress(next);
    if (xp > 0) notify(`+${xp} XP`, 'info', 'Flame');
    earned.forEach(b => notify(`Badge unlocked: ${b.name}`, 'badge', b.icon));
    if (action.type === 'quiz' && action.id < 4 && !progressRef.current.lessons[action.id + 1].done) notify(`Lesson ${action.id + 1} unlocked: ${lessonById(action.id + 1).title}`, 'ok', 'Unlock');
    if (action.type === 'quiz' && action.id === 1) notify('Phrase Drop Challenge unlocked in Practice drills', 'ok', 'Target');
    if (action.type === 'quiz' && action.id === 3) notify('Ear Training Equalizer unlocked in Practice drills', 'ok', 'Ear');
    if (action.type === 'reset') notify('Progress reset', 'info', 'RotateCcw');
  }, [notify]);
  const go = v => { if (!viewOk(v)) { notify('Finish the previous lesson to unlock this one.', 'warn', 'Lock'); return; } setView(v); setNavOpen(false); window.scrollTo({ top: 0, behavior: 'smooth' }); };
  const toggleSound = () => { const on = !soundOn; setSoundOn(on); engine.ensure(); engine.setEnabled(on); };

  const lvl = levelFor(progress.xp);
  const title = view.type === 'lesson' ? `Lesson ${view.id}` : view.type === 'drills' ? 'Practice drills' : 'Dashboard';
  return (
    <div className="flex min-h-full">
      <aside className="sticky top-0 hidden h-screen w-[290px] shrink-0 border-r border-line lg:block" style={{ top: 'env(safe-area-inset-top, 0px)' }}>
        <Roadmap progress={progress} view={view} go={go} />
      </aside>
      {navOpen && (
        <div className="fixed inset-0 z-40 lg:hidden">
          <div className="absolute inset-0 bg-black/60" onClick={() => setNavOpen(false)} />
          <div className="absolute inset-y-0 left-0 w-[min(320px,88vw)] border-r border-line shadow-2xl rise"><Roadmap progress={progress} view={view} go={go} onClose={() => setNavOpen(false)} /></div>
        </div>
      )}
      <div className="flex min-w-0 flex-1 flex-col">
        <div className="sticky z-30 flex items-center justify-between gap-3 border-b border-line bg-bg/85 py-2.5 backdrop-blur" style={{ top: 'env(safe-area-inset-top, 0px)', paddingLeft: 'max(16px, env(safe-area-inset-left, 0px))', paddingRight: 'max(16px, env(safe-area-inset-right, 0px))' }}>
          <div className="flex items-center gap-2">
            <button type="button" onClick={() => setNavOpen(true)} className="rounded-lg border border-line2 p-1.5 text-muted hover:text-fg lg:hidden" aria-label="Open curriculum"><Icon name="Menu" size={18} /></button>
            <span className="font-display text-sm font-semibold lg:hidden">DJ Academy</span>
            <span className="hidden text-sm text-muted lg:inline">{title}</span>
          </div>
          <div className="flex items-center gap-2">
            <Chip tone="warn" className="hidden sm:inline-flex"><Icon name="Flame" size={11} />{lvl.name} · {progress.xp} XP</Chip>
            <button type="button" onClick={toggleSound} className={cx('flex items-center gap-1.5 rounded-lg border px-2.5 py-1.5 text-xs font-semibold', soundOn ? 'border-neon/50 text-neon' : 'border-line2 text-muted')} aria-pressed={soundOn} title="Synthesised audio for the decks and drills">
              <Icon name={soundOn ? 'Volume2' : 'VolumeX'} size={15} />{soundOn ? 'Sound on' : 'Muted'}
            </button>
          </div>
        </div>
        <main className="mx-auto w-full max-w-[1400px] flex-1 py-5" style={{ paddingLeft: 'max(16px, env(safe-area-inset-left, 0px))', paddingRight: 'max(16px, env(safe-area-inset-right, 0px))' }}>
          {view.type === 'lesson' && <LessonView key={view.id} lesson={lessonById(view.id)} progress={progress} act={act} notify={notify} />}
          {view.type === 'drills' && <DrillsView progress={progress} act={act} notify={notify} />}
          {view.type === 'dashboard' && <Dashboard progress={progress} act={act} go={go} />}
        </main>
        <footer className="py-4 text-center text-[11px] text-dim" style={{ paddingLeft: 'max(16px, env(safe-area-inset-left, 0px))', paddingRight: 'max(16px, env(safe-area-inset-right, 0px))' }}>
          DJ Academy · all tracks are synthesised practice loops, not real songs · audio is optional
        </footer>
      </div>
      <Toasts toasts={toasts} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
